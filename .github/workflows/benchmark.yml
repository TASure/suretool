name: benchmark

on:
  push:
    branches: [main]
    paths:
      - 'sure-core/**'
      - 'sure-json/**'
      - 'sure-benchmark/**'
      - 'pom.xml'
      - '.github/workflows/benchmark.yml'
      - '.github/scripts/benchmark_gate.py'
  pull_request:
    branches: [main]
    paths:
      - 'sure-core/**'
      - 'sure-json/**'
      - 'sure-benchmark/**'
      - 'pom.xml'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'   # 每周一 05:00 UTC 全量回归

permissions:
  contents: read

jobs:
  benchmark-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build benchmark jar
        run: |
          mvn -B -pl sure-benchmark -am package -DskipTests
          # 显式选取 shade fat jar（排除 original-* 与旧版本残留，避免通配符多匹配导致 java -jar 选错）
          JAR=$(ls sure-benchmark/target/sure-benchmark-*-jar-with-dependencies.jar 2>/dev/null | grep -v '^sure-benchmark/target/original-' | head -1)
          if [ -z "$JAR" ]; then echo "::error::fat jar not found"; exit 1; fi
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Run JMH benchmarks (attempt 1)
        id: run1
        run: java -jar "$JAR" 2>&1 | tee /tmp/bench.log

      - name: Check regression thresholds (attempt 1)
        id: gate1
        run: python3 .github/scripts/benchmark_gate.py /tmp/bench.log

      # 共享 runner 上 sure/hutool 的 fork 可能落在不同负载窗口导致 ratio 虚高（曾出现 Format 1.84/2.69 误报）。
      # 首次 FAIL 时自动重跑一次确认；第二次仍 FAIL 才判定回归。
      - name: Confirm regression (attempt 2, on noise)
        if: steps.gate1.outcome == 'failure'
        run: |
          echo "首次门禁未通过，可能为共享 runner 噪声，重跑一次确认…"
          java -jar "$JAR" 2>&1 | tee /tmp/bench2.log
          python3 .github/scripts/benchmark_gate.py /tmp/bench2.log
