name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 平台 × JDK：全平台统一 JDK 25（LTS）基线
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }} on ${{ matrix.os }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build, test and verify
        run: mvn -B verify

      # 覆盖率报告按平台各自上传（verify 失败也上传，供定位平台门禁缺口）
      - name: Upload JaCoCo coverage report
        if: always() && matrix.java == '25'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            **/target/site/jacoco

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.java == '25'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            **/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  # 文档链接完整性校验（README + docs 相对链接与锚点，防断链）
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check docs links
        run: python3 .github/scripts/check_docs_links.py
