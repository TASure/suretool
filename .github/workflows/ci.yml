name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 平台 × JDK：ubuntu 双跑 LTS 21 与当前 25；macOS/Windows 验证 JDK21（跨平台文件/换行/字体/网络回归）
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [21]
        include:
          - os: ubuntu-latest
            java: 25
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }} on ${{ matrix.os }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build, test and verify
        run: mvn -B verify

      # 覆盖率上报只在单一 JDK 上执行，避免重复上传
      - name: Upload JaCoCo coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-jdk${{ matrix.java }}
          path: |
            sure-core/target/site/jacoco
            sure-json/target/site/jacoco
            sure-http/target/site/jacoco
            sure-crypto/target/site/jacoco
            sure-cron/target/site/jacoco
            sure-cache/target/site/jacoco
            sure-xml/target/site/jacoco
            sure-poi/target/site/jacoco
            sure-captcha/target/site/jacoco
            sure-jwt/target/site/jacoco
            sure-dfa/target/site/jacoco

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            sure-core/target/site/jacoco/jacoco.xml
            sure-json/target/site/jacoco/jacoco.xml
            sure-http/target/site/jacoco/jacoco.xml
            sure-crypto/target/site/jacoco/jacoco.xml
            sure-cron/target/site/jacoco/jacoco.xml
            sure-cache/target/site/jacoco/jacoco.xml
            sure-xml/target/site/jacoco/jacoco.xml
            sure-poi/target/site/jacoco/jacoco.xml
            sure-captcha/target/site/jacoco/jacoco.xml
            sure-jwt/target/site/jacoco/jacoco.xml
            sure-dfa/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
