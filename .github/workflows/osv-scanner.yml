name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  osv-scan:
    name: OSV dependency scan
    # 官方 v2 reusable workflow：全量漏洞扫描，发现漏洞即失败并上报 SARIF 到 Code scanning
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0"
