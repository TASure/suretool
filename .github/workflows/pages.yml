name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 生成 sure-core 覆盖率 badge（随文档站一起发布，README 徽章引用）
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Generate sure-core coverage report
        run: mvn -B -pl sure-core test jacoco:report

      - name: Build coverage badge
        run: python3 .github/scripts/coverage_badge.py sure-core/target/site/jacoco/jacoco.csv coverage

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate aggregated Javadoc (11 JPMS modules)
        run: mvn -B javadoc:aggregate -pl sure-core,sure-json,sure-http,sure-crypto,sure-cron,sure-cache,sure-xml,sure-poi,sure-captcha,sure-jwt,sure-dfa -am -DskipTests

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Stage javadoc into _site/api
        run: |
          # jekyll-build-pages@v1 生成的 _site 属 root，先解锁再写入
          sudo chmod -R a+rwX _site
          mkdir -p _site/api
          cp -r target/site/apidocs/. _site/api/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
