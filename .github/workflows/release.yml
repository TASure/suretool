name: Release to Maven Central

# 自动化发布流水线：全量门禁 -> 构建发布制品（含源码/JavaDoc/SBOM）-> GPG 签名 ->
# OSSRH Staging 上传并发布（io.github.tasure 命名空间绑定 OSSRH Staging API，Portal /upload 端点对其返回 500，
# 故使用 mvn deploy + nexus-staging:release 通道，2026-10-08 修复）-> 校验 repo1 可访问 -> 创建 GitHub Release。
#
# 触发方式：
#   1) 推送 v* 标签（如 v1.1.0）：git tag v1.1.0 && git push origin v1.1.0
#   2) 手动触发：Actions -> Release to Maven Central -> Run workflow
#
# 前置条件（GitHub 仓库 Settings -> Secrets and variables -> Actions）：
#   SONATYPE_USERNAME   Sonatype Central 用户令牌用户名（User Token 的 username，如 "GMFea1"）
#   SONATYPE_PASSWORD   Sonatype Central 用户令牌密码（User Token 的 password）
#   GPG_PRIVATE_KEY     GPG 签名私钥（ASCII armor 格式，base64 编码后存入）
#   GPG_PASSPHRASE      GPG 私钥口令
#
# 说明：sonatype-central-portal 上传为异步任务，本流水线轮询 repo1 直到制品可访问。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Import GPG key
        if: steps.check.outputs.published != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Resolve version and tag
        id: version
        run: |
          VER=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [[ "$VER" == *-SNAPSHOT ]]; then
            echo "::error::发布版本不能是 SNAPSHOT: $VER"
            exit 1
          fi
          REF="${{ github.ref_name }}"
          if [[ "$REF" == v* ]]; then
            echo "tag=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Check already published (idempotent release)
        id: check
        run: |
          VER="${{ steps.version.outputs.version }}"
          echo "published=false" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://repo1.maven.org/maven2/io/github/tasure/sure-core/$VER/sure-core-$VER.jar")
          if [ "$code" = "200" ]; then
            echo "版本 $VER 已在 Maven Central（repo1 可访问），跳过发布流程"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and verify (release profile, skip gpg inside maven)
        if: steps.check.outputs.published != 'true'
        run: mvn -B -Prelease -Dgpg.skip=true verify

      - name: Stage bundle (maven layout + manifest)
        if: steps.check.outputs.published != 'true'
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          rm -rf bundle
          mkdir -p bundle/META-INF
          printf 'Manifest-Version: 1.0\ngroupId: io.github.tasure\nartifactId: suretool\nversion: %s\npackaging: pom\n' "$VER" \
            > bundle/META-INF/MANIFEST.MF
          # 父 pom
          mkdir -p "bundle/io/github/tasure/suretool/$VER"
          cp pom.xml "bundle/io/github/tasure/suretool/$VER/suretool-$VER.pom"
          # 各模块：pom + 主 jar + sources + javadoc（严格匹配当前版本，排除 tests/original）
          for pom in */pom.xml; do
            art="${pom%/pom.xml}"
            [ "$art" = "." ] && continue
            base="bundle/io/github/tasure/$art/$VER"
            mkdir -p "$base"
            cp "$pom" "$base/$art-$VER.pom"
            for jar in "$art"/target/*.jar; do
              [ -f "$jar" ] || continue
              case "$jar" in
                *-$VER.jar | *-$VER-sources.jar | *-$VER-javadoc.jar) cp "$jar" "$base/" ;;
                *) continue ;;
              esac
            done
          done
          echo "=== bundle 内容 ==="
          find bundle -type f | sort

      - name: Sign bundle files (GPG detached asc)
        if: steps.check.outputs.published != 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          find bundle -type f | while read -r f; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign --output "$f.asc" "$f"
          done
          echo "=== 签名文件 ==="
          find bundle -name '*.asc' | wc -l

      - name: Package bundle zip
        if: steps.check.outputs.published != 'true'
        run: |
          VER="${{ steps.version.outputs.version }}"
          (cd bundle && zip -r "../suretool-$VER-bundle.zip" .)

      - name: Configure Maven settings (OSSRH staging + GPG)
        if: steps.check.outputs.published != 'true'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<SETTINGS
          <settings>
            <servers>
              <server>
                <id>ossrh</id>
                <username>$SONATYPE_USERNAME</username>
                <password>$SONATYPE_PASSWORD</password>
              </server>
            </servers>
            <properties>
              <gpg.keyname>D4CB857FBF6D720F38F26062350F235EAF989176</gpg.keyname>
              <gpg.passphrase>$GPG_PASSPHRASE</gpg.passphrase>
            </properties>
          </settings>
          SETTINGS
          echo "settings.xml 已生成 (ossrh + gpg)"

      - name: Deploy to OSSRH staging (GPG-signed)
        if: steps.check.outputs.published != 'true'
        run: mvn -B -Prelease deploy

      - name: Publish staging deployment to Maven Central (Portal API)
        if: steps.check.outputs.published != 'true'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          set -euo pipefail
          # deploy 产生的部署进入 VALIDATED 后，调用 Portal publish API 发布到 Central。
          # （nexus-staging:release 在 JDK25 因 XStream 模块访问报错，改用官方 Portal publish 端点，v1.7.0 已验证 HTTP 204）
          ID=""
          for i in $(seq 1 30); do
            ID=$(curl -s -u "$SONATYPE_USERNAME:$SONATYPE_PASSWORD" \
              https://central.sonatype.com/api/v1/publisher/deployments \
              | jq -r '[.deployments[] | select(.deploymentState=="VALIDATED")] | sort_by(.createTimestamp) | .[-1].deploymentId // empty')
            if [ -n "$ID" ]; then break; fi
            echo "[$i/30] 等待部署进入 VALIDATED…"
            sleep 10
          done
          if [ -z "$ID" ]; then
            echo "::error::未找到 VALIDATED 部署，请检查 deploy 结果"
            exit 1
          fi
          echo "发布部署: $ID"
          curl -sS -X POST -u "$SONATYPE_USERNAME:$SONATYPE_PASSWORD" \
            -o /dev/null -w 'publish HTTP %{http_code}\n' \
            "https://central.sonatype.com/api/v1/publisher/deployment/$ID"

      - name: Wait for Maven Central sync
        if: steps.check.outputs.published != 'true'
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          code=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://repo1.maven.org/maven2/io/github/tasure/sure-core/$VER/sure-core-$VER.jar")
            if [ "$code" = "200" ]; then
              echo "repo1 已同步 sure-core $VER"
              break
            fi
            echo "[$i/60] 等待中央仓库同步 (HTTP $code)…"
            sleep 10
          done
          if [ "$code" != "200" ]; then
            echo "::error::发布后 10 分钟仍未在 repo1 可见，请检查 Sonatype Portal 状态"
            exit 1
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "suretool-$VER-bundle.zip" \
              --title "suretool $VER" \
              --notes "suretool $VER 已发布到 Maven Central：io.github.tasure:*"
          else
            echo "Release $TAG 已存在，跳过创建"
          fi
